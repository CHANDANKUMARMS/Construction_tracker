<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Individual Dashboard | BuildTrack</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

    <div class="logo">
        👷 BuildTrack
    </div>

    <button id="logoutBtn">
        Logout
    </button>

</header>

<main>

    <!-- ================= Dashboard ================= -->

    <section id="dashboardSection">

        <div class="welcome-card">

            <h2>
                Welcome to your Dashboard
            </h2>

            <p>
                Join new projects and monitor the projects assigned to you.
            </p>

        </div>

        <div class="dashboard-container">

            <!-- Join Project -->

            <section class="join-project-card">

                <h3>
                    Join Project
                </h3>

                <input
                    type="text"
                    id="projectCodeInput"
                    placeholder="Enter Project Code"
                >

                <button id="joinProjectBtn">
                    Join Project
                </button>

            </section>


            <!-- Browse Projects -->

            <section class="projects-card">

                <div class="projects-header">

                    <h3>
                        My Projects
                    </h3>

                    <input
                        type="text"
                        id="searchProject"
                        placeholder="Search Projects..."
                    >

                </div>

                <table>

                    <thead>

                        <tr>

                            <th>Name</th>

                            <th>Code</th>

                            <th>Status</th>

                            <th>Role</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="browseProjectsBody">

                    </tbody>

                </table>

            </section>

        </div>

    </section>


    <!-- ================= Project Details ================= -->

    <section
        id="projectSection"
        class="hidden"
    >

        <button id="backBtn">
            ← Back
        </button>

        <h2 id="projectName"></h2>

        <div class="project-info-grid">

            <div>

                <strong>Project Code:</strong>

                <span id="projectCode"></span>

            </div>

            <div>

                <strong>Location:</strong>

                <span id="projectLocation"></span>

            </div>

            <div>

                <strong>Status:</strong>

                <select id="projectStatus">

                    <option>Active</option>

                    <option>Completed</option>

                </select>

                <button id="updateProjectStatusBtn">
                    Update
                </button>

            </div>

        </div>


        <!-- Progress -->

        <div class="progress-container">

            <div
                id="progressBar"
                class="progress-bar"
            >
                0%
            </div>

        </div>


        <!-- Tabs -->

        <div class="project-tabs">

            <button
                id="overviewBtn"
                class="active"
            >
                Overview
            </button>

            <button id="tasksBtn">
                Tasks
            </button>

            <button id="engineersBtn">
                Engineers
            </button>

            <button id="clientsBtn">
                Clients
            </button>

        </div>


        <!-- ================= Overview ================= -->

        <div id="overviewDiv">

            <div class="stats-grid">

                <div class="stat-card">

                    <h3 id="totalTasks">0</h3>

                    <p>Total Tasks</p>

                </div>

                <div class="stat-card">

                    <h3 id="completedTasks">0</h3>

                    <p>Completed</p>

                </div>

                <div class="stat-card">

                    <h3 id="pendingTasks">0</h3>

                    <p>Pending</p>

                </div>

            </div>

        </div>


        <!-- ================= Tasks ================= -->

        <div
            id="tasksDiv"
            class="hidden"
        >

            <div class="add-task">

                <input
                    id="taskNameInput"
                    placeholder="Task Name"
                >

                <input
                    type="date"
                    id="taskDeadlineInput"
                >

                <button id="addTaskBtn">
                    Add Task
                </button>

            </div>

            <table>

                <thead>

                    <tr>

                        <th>Task</th>

                        <th>Deadline</th>

                        <th>Status</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="tasksBody">

                </tbody>

            </table>

        </div>


        <!-- ================= Engineers ================= -->

        <div
            id="engineersDiv"
            class="hidden"
        >

            <div class="invite-section">

                <input
                    id="engineerEmail"
                    placeholder="Engineer Email"
                >

                <button id="inviteEngineerBtn">
                    Invite Engineer
                </button>

            </div>

            <table>

                <thead>

                    <tr>

                        <th>Email</th>

                        <th>Status</th>

                    </tr>

                </thead>

                <tbody id="engineersBody">

                </tbody>

            </table>

        </div>


        <!-- ================= Clients ================= -->

        <div
            id="clientsDiv"
            class="hidden"
        >

            <div class="invite-section">

                <input
                    id="clientEmail"
                    placeholder="Client Email"
                >

                <button id="inviteClientBtn">
                    Invite Client
                </button>

            </div>

            <table>

                <thead>

                    <tr>

                        <th>Email</th>

                        <th>Status</th>

                    </tr>

                </thead>

                <tbody id="clientsBody">

                </tbody>

            </table>

        </div>

    </section>

</main>

<script src="../config.js"></script>
<script src="js/dashboard.js"></script>

</body>

</html>
