<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee / Client Portal | BuildTrack</title>

    <link rel="stylesheet" href="css/auth.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="left">

        <h1>👷 BuildTrack</h1>

        <h2>Employee / Client Portal</h2>

        <p>
            Join your assigned construction projects and collaborate with your company securely.
        </p>

    </div>


    <div class="right">

        <div class="tabs">

            <button type="button" class="active" id="loginTab">
                Individual Login
            </button>

            <button type="button" id="signupTab">
                Register individual
            </button>

        </div>


        <!-- LOGIN -->

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>



        <!-- SIGNUP -->

        <form id="signupForm" class="hidden">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="signupEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

    </div>

</div>

<script src="../config.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
